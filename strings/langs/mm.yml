thumb_1 : "⊚ ဓာတ်ပုံဆက်တင်များ (Thumbnail Settings) :\n\n➻ /thumb : Stream များ၏ Visual Settings ကို စီမံပါ။\n\n⊚ Thumbnail Toggle ဆိုသည်မှာ အဘယ်နည်း?\n\n💮 သီချင်း၏ မူရင်းမျက်နှာဖုံးပုံ ပြသမှုကို အဖွင့်/အပိတ် လုပ်ခြင်း ဖြစ်သည်။ ပိတ်ထားပါက Data သုံးစွဲမှုကို လျှော့ချပေးပြီး Chat မျက်နှာပြင်ကို သပ်ရပ်စေသည်။\n\n๏ Panel ပြင်ဆင်မှုများ :\n\n• Enable : Stream အချက်အလက်နှင့်အတူ မျက်နှာဖုံးပုံပါ ပြသမည်။\n• Disable : စာသားသက်သက်သာ ပေးပို့မည်။\n• Close : ပြင်ဆင်မှု Panel ကို ပိတ်မည်။\n\n๏ မှတ်ချက် : ဆက်တင်များကို Chat တစ်ခုစီအတွက် သီးခြားစီ သိမ်းဆည်းပေးသည်။"

