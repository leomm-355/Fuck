help_1: |
  <blockquote>သင် အကူအညီလိုချင်သော အမျိုးအစားကို ရွေးချယ်ပါ။
  သိလိုသည်များကို <a href="https://t.me/myanmar_music_bot2027">Support Chat</a> တွင် မေးမြန်းနိုင်ပါသည်

  Command များကို <code>/</code> ဖြင့် စတင်အသုံးပြုနိုင်ပါသည် : </>

help_2: |
  <b><u>❖ Auth Module အတွက် အကူအညီ :</u></b>

  <b><u>❖ Auth Users များ :</u></b>

  <b>Auth Users များသည် Chat တွင် Admin Rights မရှိသော်လည်း ဘော့တ်၏ Admin Command များကို အသုံးပြုနိုင်ပါသည်။ [Admins သာလျှင်]</b>

  <b>๏ /auth [username] —</b> User တစ်ဦးကို Auth List သို့ ထည့်မည်။
  <b>๏ /unauth [username] —</b> User တစ်ဦးကို Auth List မှ ဖယ်ရှားမည်။
  <b>๏ /authusers —</b> Group တွင်းရှိ Auth Users စာရင်းကို ပြသမည်။

help_3: |
  <b><u>❖ Blacklist Module အတွက် အကူအညီ :</u></b>

  <b><u>❖ Blacklist Chat :</u></b>

  <b>๏ /blacklistchat [chat_id] —</b> Chat တစ်ခုကို ဘော့တ် အသုံးပြုခွင့် မည်းစာရင်းသွင်းမည်။
  <b>๏ /whitelistchat [chat_id] —</b> Chat တစ်ခုကို မည်းစာရင်းမှ ဖယ်ရှားမည်။
  <b>๏ /blacklistedchat —</b> မည်းစာရင်းဝင် Chat များ စာရင်းကို ပြသမည်။

  <b><u>❖ Block Users :</u></b>

  <b>๏ /block [username သို့မဟုတ် reply] —</b> User တစ်ဦးကို ဘော့တ် အသုံးပြုခွင့် ပိတ်ပင်မည်။
  <b>๏ /unblock [username သို့မဟုတ် reply] —</b> ပိတ်ပင်ထားသော User ကို ပြန်လည်ဖွင့်ပေးမည်။
  <b>๏ /blockedusers —</b> ပိတ်ပင်ထားသော Users များ စာရင်းကို ပြသမည်။

help_4: |
  <b><u>❖ Broadcast Module အတွက် အကူအညီ :</u></b>

  <b><u>❖ Broadcast Feature [Sudoers များအတွက်သာ] :</u></b>

  <b>๏ /broadcast [message သို့မဟုတ် reply] —</b> ဘော့တ် ဝန်ဆောင်မှုပေးထားသော Chats အားလုံးသို့ မက်ဆေ့ချ် ပို့မည်။

  <b><u>❖ Broadcasting Modes :</u></b>

  ๏ <code>-pin</code> : ပို့ဆောင်သော မက်ဆေ့ချ်များကို Pin လုပ်မည်။
  ๏ <code>-pinloud</code> : မက်ဆေ့ချ်များကို Pin လုပ်ပြီး အဖွဲ့ဝင်များအား အကြောင်းကြားမည်။
  ๏ <code>-user</code> : ဘော့တ်ကို Start လုပ်ထားသော အသုံးပြုသူများထံ ပို့မည်။
  ๏ <code>-nobot</code> : ဘော့တ်မှ ပို့ဆောင်ခြင်းကို တားဆီးမည်။

  <pre language="python">๏ ဥပမာ : /broadcast -user -pin စမ်းသပ်စာသား ပို့ခြင်း</pre>

help_5: |
  <b><u>❖ Ping Module အတွက် အကူအညီ :</u></b>

  <b><u>❖ Ping Commands များ :</u></b>

  <b>๏ /ping —</b> ဘော့တ်၏ Ping နှင့် System Stats ကို ပြသမည်။
  <b>๏ /stats —</b> ကမ္ဘာလုံးဆိုင်ရာ ထိပ်တန်း သီချင်း ၁၀ ပုဒ်၊ သုံးစွဲသူများ၊ Chats များနှင့် စာရင်းများကို ပြသမည်။

help_6: |
  <b><u>❖ Play Module အတွက် အကူအညီ :</u></b>

  <b><u>❖ Play Commands များ :</u></b>

  <b>๏ c</b> သည် Channel Play ကို ကိုယ်စားပြုသည်။
  <b>๏ v</b> သည် Video Play ကို ကိုယ်စားပြုသည်။
  <b>๏ force</b> သည် Force Play ကို ကိုယ်စားပြုသည်။

  <b>๏ /play သို့မဟုတ် /vplay သို့မဟုတ် /cplay —</b> Voice Chat တွင် သီချင်း စတင်လွှင့်မည်။
  <b>๏ /playforce သို့မဟုတ် /vplayforce သို့မဟုတ် /cplayforce —</b> လက်ရှိဖွင့်နေသည်ကို ရပ်ပြီး တောင်းဆိုသော သီချင်းကို ချက်ချင်းဖွင့်မည်။
  <b>๏ /channelplay [chat username သို့မဟုတ် ID] သို့မဟုတ် [disable] —</b> Channel ကို Group နှင့် ချိတ်ဆက်ပြီး Group ထဲမှ အမိန့်ပေး ဖွင့်လှစ်မည်။

help_7: |
  <b><u>❖ Sudo Module အတွက် အကူအညီ :</u></b>

  <b>❖ Paid သို့မဟုတ် Free ၏ အဓိပ္ပာယ် :</b>
  <b>๏ Free —</b> Pro Coders များအတွက် 😎
  <b>๏ Paid —</b> သင့် Status ကို ပြသသည် 😉

  <b>❖ Storage Cleaner — Paid :</b>
  ๏ <b>/clean</b> — Storage သုံးစွဲမှုနှင့် ရှင်းလင်းနိုင်သော Folders များကို ကြည့်မည်။
  ๏ သီးခြား Folders များကို ရှင်းလင်းရန် ခလုတ်များကို နှိပ်ပါ:
     ├ downloads
     ├ cache
     └ temp
  ๏ <b>Clean All</b> — ယာယီဖိုင်များ အားလုံးကို ရှင်းလင်းမည်။
  ❖ Folder ဖွဲ့စည်းပုံ၊ အရွယ်အစားနှင့် ဖိုင်အရေအတွက်များ။
  ❖ Disk အချက်အလက် အပြည့်အစုံကိုလည်း ပြသပေးမည်။

  <b>❖ File Manager — Paid :</b>
  <b>๏ Soon</b> — အနာဂတ် Update တွင် ပါဝင်လာမည်။

  <b>❖ ရရှိနိုင်သော Tools များ — Free :</b>
  <b>๏ /logs —</b> ဘော့တ်၏ Logs များကို ရယူမည်။
  <b>๏ /logger [enable/disable] —</b> ဘော့တ်၏ Activity Logging ကို အဖွင့်/အပိတ် ပြုလုပ်မည်။
  <b>๏ /maintenance [enable/disable] —</b> ဘော့တ်၏ Maintenance Mode ကို အဖွင့်/အပိတ် ပြုလုပ်မည်။

  <b>❖ Sudo List စီမံရန် :</b>
  <b>๏ /sudo —</b> Sudo User ထည့်သွင်းမည်။
  <b>๏ /rmsudo —</b> Sudo User ဖယ်ရှားမည်။
  <b>๏ /sudolist —</b> Sudo List ကို ကြည့်ရှုမည်။
  <b>๏ /delallsudo —</b> Sudo Users အားလုံးကို ဖယ်ရှားမည်။ [Paid]

help_8: |
  <b><u>❖ Active Videochats Module အတွက် အကူအညီ :</u></b>

  <b><u>❖ Active Videochats :</u></b>

  <b>๏ /activevoice —</b> လက်ရှိဖွင့်ထားသော Voice Chats များ စာရင်းကို ပြသမည်။
  <b>๏ /activevideo —</b> လက်ရှိဖွင့်ထားသော Video Chats များ စာရင်းကို ပြသမည်။
  <b>๏ /autoend [enable/disable] —</b> နားထောင်သူမရှိပါက အလိုအလျောက် ပိတ်မည့်စနစ်ကို အဖွင့်/အပိတ် ပြုလုပ်မည်။

help_9: |
  <b><u>❖ Start Module အတွက် အကူအညီ :</u></b>

  <b><u>❖ ဘော့တ် စတင်အသုံးပြုခြင်း :</u></b>

  <b>๏ /start —</b> Music Bot ကို စတင်မည်။
  <b>๏ /help —</b> Help Menu ကို ဖွင့်ပြီး Command ရှင်းလင်းချက်များကို ကြည့်မည်။
  <b>๏ /reboot —</b> လက်ရှိ Chat အတွက် ဘော့တ်ကို Reboot လုပ်မည်။
  <b>๏ /settings —</b> Interactive Inline Menu ဖြင့် Group ဆက်တင်များကို ဖွင့်မည်။

help_10: |
  <b><u>❖ Autoplay အတွက် အကူအညီ :</u></b>

  <b>๏ /autoplay [on/off] —</b> တန်းစီစာရင်း ပြီးပါက ဆက်စပ်သီချင်းများ အလိုအလျောက်ဖွင့်သည့် စနစ်ကို အဖွင့်/အပိတ် ပြုလုပ်မည်။
  <b>๏ /askip —</b> လက်ရှိသီချင်းကို ကျော်ပြီး Autoplay ညွှန်းဆိုချက်အတိုင်း ချက်ချင်းဖွင့်မည်။ [Autoplay Mode On ဖြစ်ရမည်]

help_11: |
  <b><u>❖ Thumbnails အတွက် အကူအညီ :</u></b>

  <b>๏ /thumb [enable/disable] —</b> သီချင်းအချက်အလက် ပို့သည့်အခါ Thumbnail ပုံ ပါ/မပါ အဖွင့်/အပိတ် ပြုလုပ်မည်။

help_12: |
  <b><u>❖ Audio Filters အတွက် အကူအညီ :</u></b>

  💮 ပိုမိုကောင်းမွန်သော ခံစားမှုအတွက် Stream တွင် Audio Effect များ ထည့်သွင်းပါ။

  <b><b>๏ /bass —</b> သီချင်း၏ Bass သံကို မြှင့်တင်မည်။
  <b>๏ /echo —</b> Reverb နှင့် Echo အသံလှိုင်း Effect ထည့်သွင်းမည်။
  <b>๏ /slowed —</b> သီချင်းအနှေး အမြန်နှုန်းနှင့် Reverb ထည့်မည်။
  <b>๏ /nightcore —</b> သီချင်း၏ Pitch နှင့် အမြန်နှုန်းကို မြှင့်တင်မည်။
  <b>๏ /normal —</b> Effect များအားလုံးကို မူလအတိုင်း ပြန်လည်သတ်မှတ်မည်။

help_13: |
  <b><u>❖ TTS Greeting အတွက် အကူအညီ :</u></b>

  💮 TTS (Text-to-Speech) Shraddha အသံဖြင့် နှုတ်ဆက်သည့်စနစ်ကို စီမံမည်။ [Owner သာလျှင်]
  📌 ဤ ဆက်တင်များသည် <b>Global</b> ဖြစ်ပြီး Groups အားလုံးတွင် သက်ရောက်မည် ဖြစ်သည်။

  <b>๏ /tts [on/off] —</b> အသံဖြင့် နှုတ်ဆက်ခြင်းကို ကမ္ဘာလုံးဆိုင်ရာ အဖွင့်/အပိတ် ပြုလုပ်မည်။
  <b>๏ /ttsdur [1-15] —</b> စောင့်ဆိုင်းရမည့် ကြာချိန်ကို စက္ကန့်အလိုက် သတ်မှတ်မည်။
  <b>๏ /ttstxt [message] —</b> နှုတ်ဆက် စာသားကို သတ်မှတ်မည်။
